<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fashion Data Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one stage card per screen; the team game puts the question left and a live scoreboard right, stacking on phones. */
:root {
  --bg: #FCFAFA; --surface: #FFFFFF; --sunk: #F0EAEA; --line: #D9CFD2;
  --fg: #1D1D1B; --muted: #61615C;
  --plum: #43123F; --mag: #7E0950; --lime: #C4C600; --orange: #EC940C; --red: #AF1E0B;
  --ok: #2F7D3B; --ok-bg: #E4F2E4; --bad: #AF1E0B; --bad-bg: #F8E3DF;
  --on-plum: #FFFFFF; --on-lime: #1D1D1B;
  --display: "Tomorrow", "Arial Narrow", system-ui, sans-serif;
  --body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171014; --surface: #22181E; --sunk: #2D2128; --line: #47353F;
  --fg: #F3ECEF; --muted: #B8A9B1;
  --plum: #C98BC3; --mag: #E37BB5; --lime: #D6D84A; --orange: #F2AA3B; --red: #F07A66;
  --ok: #7BCB86; --ok-bg: #1E3322; --bad: #F07A66; --bad-bg: #3B1E1A;
  --on-plum: #171014; --on-lime: #171014; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171014; --surface: #22181E; --sunk: #2D2128; --line: #47353F;
  --fg: #F3ECEF; --muted: #B8A9B1;
  --plum: #C98BC3; --mag: #E37BB5; --lime: #D6D84A; --orange: #F2AA3B; --red: #F07A66;
  --ok: #7BCB86; --ok-bg: #1E3322; --bad: #F07A66; --bad-bg: #3B1E1A;
  --on-plum: #171014; --on-lime: #171014; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 1rem; line-height: 1.5; padding-inline: 16px; padding-block: 20px 40px }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15 }
.eyebrow { font-family: var(--display); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mag); font-weight: 700 }
.muted { color: var(--muted) }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: .65em 1.1em }
button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px }
button.primary { background: var(--plum); color: var(--on-plum); border-color: var(--plum); font-weight: 600 }
button.ghost { background: transparent }
button:disabled { opacity: .45; cursor: default }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }

/* Header */
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; border-bottom: 2px solid var(--fg); padding-bottom: 12px }
header.top h1 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); font-weight: 800 }
header.top h1 span { color: var(--mag) }

/* Start screen */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px }
.quizcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 12px; align-content: start }
.quizcard h2 { font-size: 1.35rem }
.quizcard .covers { font-size: .92rem }
.quizcard .row button { flex: 1 1 140px }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px }
.mode { background: var(--sunk); border-radius: 8px; padding: 16px 18px; min-width: 0 }
.mode h3 { font-size: 1rem; margin-bottom: 4px }
.teamsetup { display: grid; gap: 10px }
.teamsetup summary { cursor: pointer }
button.small { font-size: .88rem; padding: .3em 0; border: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); justify-self: start }
.join { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--sunk); border-radius: 6px; padding: 10px 14px; font-weight: 600 }
.join code { font-family: var(--display); font-size: 1.05rem; color: var(--mag) }
.teamsetup .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.teamsetup input { font: inherit; width: 100%; padding: .5em .7em; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg) }

/* Game */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start }
.solo .game { grid-template-columns: minmax(0, 1fr) }
@media (max-width: 860px) { .game { grid-template-columns: minmax(0, 1fr) } }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: clamp(18px, 3vw, 34px); display: grid; gap: 20px; min-width: 0 }
.progress { display: flex; gap: 4px }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk) }
.progress i.done { background: var(--mag) }
.progress i.now { background: var(--orange) }
.qmeta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums }
.question { font-size: clamp(1.35rem, 2.8vw, 2.1rem); font-weight: 700 }
.data { background: var(--sunk); border-radius: 6px; padding: 10px 14px; font-variant-numeric: tabular-nums; overflow-x: auto }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
@media (max-width: 600px) { .options { grid-template-columns: minmax(0, 1fr) } }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; padding: 14px 16px; font-size: clamp(1rem, 1.6vw, 1.2rem); border-width: 2px; min-height: 64px }
.opt b { font-family: var(--display); display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; color: var(--on-plum) }
.opt:nth-child(1) b { background: var(--plum) } .opt:nth-child(2) b { background: var(--mag) }
.opt:nth-child(3) b { background: var(--red) } .opt:nth-child(4) b { background: var(--orange); color: var(--on-lime) }
.opt.correct { border-color: var(--ok); background: var(--ok-bg) }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg) }
.opt.dim { opacity: .5 }
.opt.mine { border-color: var(--mag); border-width: 3px; background: var(--sunk) }
.opt-static { border: 2px solid var(--line); border-radius: 6px; background: var(--surface) }
.opt:disabled { opacity: 1; cursor: default }
.opt.dim:disabled { opacity: .5 }
.feedback { border-radius: 8px; padding: 16px 18px; display: grid; gap: 6px }
.feedback.ok { background: var(--ok-bg); border: 1px solid var(--ok) }
.feedback.bad { background: var(--bad-bg); border: 1px solid var(--bad) }
.feedback .verdict { font-family: var(--display); font-weight: 700; font-size: 1.1rem }
.slideref { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 600 }
.slideref .num { white-space: nowrap; font-family: var(--display); background: var(--lime); color: var(--on-lime); border-radius: 4px; padding: .1em .5em }
.timer { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right }
.timer.low { color: var(--red) }

/* Scoreboard */
.board { background: var(--plum); color: var(--on-plum); border-radius: 8px; padding: 18px; display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }
.board h3 { font-size: 1rem; letter-spacing: .12em; text-transform: uppercase }
.board ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.board li { display: grid; grid-template-columns: 1.6em 1fr auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums }
.board li .pts { font-family: var(--display); font-weight: 700; font-size: 1.2rem }
.board .hint { font-size: .85rem; opacity: .85 }
.award { display: grid; gap: 8px }
.award .chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border-radius: 999px; padding: .45em 1em; border: 2px solid var(--line) }
.chip[aria-pressed="true"] { background: var(--lime); color: var(--on-lime); border-color: var(--lime); font-weight: 600 }

/* Results */
.podium { display: grid; gap: 10px }
.podium .p { display: grid; grid-template-columns: 2.4em 1fr auto; gap: 12px; align-items: center; background: var(--sunk); border-radius: 8px; padding: 12px 16px; font-size: 1.15rem; font-variant-numeric: tabular-nums }
.podium .p:first-child { background: var(--lime); color: var(--on-lime); font-size: 1.4rem }
.podium .p .rank { font-family: var(--display); font-weight: 800 }
.review { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none }
.review li { background: var(--sunk); border-radius: 6px; padding: 10px 14px }
footer { font-size: .85rem; color: var(--muted) }
@media (prefers-reduced-motion: no-preference) { .opt, .chip { transition: background .15s, border-color .15s } }
</style>

</head><body><div class="wrap" id="app"></div>

<script>
const QUIZZES = {
  w3: {
    title: "Week 3 review quiz (homework)",
    covers: "Homework before Week 4. 25 scenario questions on everything from Week 3: data sources and what one row is, cleaning labels, pivot tables and calculated fields, value and volume, volatility, Pareto, discounts, campaigns and channels, honest charts and insight headlines. Some need a small calculation. Take your time.",
    questions: [
      { q: "You build a pivot of 2025 revenue by channel. It shows six rows: “Store”, “Store ” (with a space), “STORE”, “Online”, “online” and “App”. The manager wants three channels. What is the best fix?",
        o: ["Delete the rows with odd spellings, because they are only a few lines", "Add a helper column with =PROPER(TRIM(O2)) and use it as Rows", "Add a helper column with =UPPER(O2) and use it as Rows", "Sort the channel column A to Z so the spellings group together"], a: 1,
        why: "A pivot treats every spelling as a different channel, even one extra space. TRIM removes spaces at the start and end and PROPER fixes the capitals, so only three values remain. UPPER alone keeps “STORE ” with its space, and deleting rows throws away real sales.", s: 18, t: "Clean it with a helper column" },
      { q: "A colleague adds a calculated field to her pivot: =SUM(revenue_euro)/COUNTA(order_id). The cell shows #NAME?. What went wrong?",
        o: ["COUNTA cannot count IDs, so she must use SUM of order_id instead", "The pivot needs a filter on year before a calculated field can work", "Calculated fields only work when Summarise by is set to SUM", "The column is called revenue_eur in row 1; names must match exactly"], a: 3,
        why: "A calculated field reads the column names from row 1. One wrong letter (euro instead of eur) and Sheets does not know the name, so it shows #NAME? or #REF!. Copy the names exactly from the header row.", s: 23, t: "Zoom: the calculated field" },
      { q: "Your AOV calculated field =SUM(revenue_eur)/COUNTA(order_id) shows about €1.9 million for 2024, not about €290. The formula is typed correctly. What is the most likely cause?",
        o: ["Summarise by is set to SUM, so it adds up a value per row; use Custom", "The year column is formatted as a number instead of as a date", "COUNTA also counts empty cells, so the number of orders is too small", "The pivot range is too large and includes the Data Dictionary tab"], a: 0,
        why: "With Summarise by SUM, the field is worked out for each row and then added up, which gives almost the total revenue. With Custom, Sheets divides the totals: all revenue divided by all order lines. That is the AOV.", s: 23, t: "Zoom: the calculated field" },
      { q: "You make a pivot with month_name in Rows and year in Columns. Your line chart then shows the months in this order: April, August, December, February… Why, and what is the fix?",
        o: ["The dates are text; format order_date as Date and rebuild the chart", "The chart type is wrong; switch from a line chart to a column chart", "Month names sort A to Z; put month (1 to 12) in Rows instead", "Year in Columns mixes up the months; move year into Filters instead"], a: 2,
        why: "month_name is text, so the pivot sorts it alphabetically and the line jumps around the calendar. The month column holds the numbers 1 to 12, which sort in time order. You can add the names later as labels if you want.", s: 25, t: "Month by month: growth, volatility, peak vs low" },
      { q: "You select your category pivot and insert a bar chart. One bar, labelled “Grand Total”, is much longer than all the others, and the real categories look tiny. What happened?",
        o: ["Sheets renamed Leather Goods because it is the largest category", "The pivot used COUNTA instead of SUM, so one category counted twice", "The chart shows % of column, which always adds an extra 100% bar", "You also selected the Grand Total row; select only the category rows"], a: 3,
        why: "The Grand Total row is the sum of all categories, so it squeezes every real bar flat. Select only the category rows, or untick “Show totals” in the pivot editor before you make the chart. Always check what you selected before you insert a chart.", s: 32, t: "Each category's share of the year" },
      { q: "The CRM manager asks: “For campaign lines only, how much revenue did each campaign bring in each channel?” Which pivot setup answers this?",
        o: ["Rows: channel_clean · Columns: year · Values: COUNTA of campaign_name · Filter: campaign_flag = Yes", "Rows: campaign_name · Columns: channel_clean · Values: SUM of revenue_eur · Filter: campaign_flag = Yes", "Rows: campaign_flag · Columns: campaign_name · Values: AVERAGE of revenue_eur · Filter: none", "Rows: campaign_name · Columns: channel · Values: SUM of quantity · Filter: year = 2025"], a: 1,
        why: "Say the question as a sentence first: revenue (Values) by campaign (Rows) and channel (Columns), for campaign lines only (Filter). Use channel_clean, not channel, or the messy spellings come back. COUNTA counts lines and quantity counts pieces, not money.", s: 42, t: "Which campaign sold where?" },
      { q: "Your pivot has category in Rows, year in Columns and SUM of revenue_eur in Values. The director asks: “What share of each year's revenue did each category bring?” What do you change?",
        o: ["Summarise by AVERAGE, so each category shows its average share", "Show as % of row, so each category's two years add up to 100%", "Show as % of column, so each year's categories add up to 100%", "Show as % of grand total, so all the cells add up to 100% together"], a: 2,
        why: "Each year is a column, so “share of each year” means % of column: the categories in 2024 add up to 100%, and the same for 2025. % of row splits one category between the two years, which answers a different question. Leather goods comes out at about 37% of 2025.", s: 32, t: "Each category's share of the year" },
      { q: "In your copy of the Galeries Lafayette file, =COUNTA(A2:A) gives 12,849. A colleague writes on the team slide: “12,849 customers bought from us in 2024–2025.” What is wrong?",
        o: ["Nothing: each row is one customer, so this is the number of customers", "COUNTA also counts the header row, so the right number is 12,848", "One row is one product in one order, and the file has no customer ID", "COUNTA only counts numbers, so the text order IDs are left out"], a: 2,
        why: "One row = one order line: one product in one order. One customer can buy many times and many products, and the file has no customer ID, so it cannot tell you how many customers you have. Say “12,849 order lines” and name the blind spot.", s: 10, t: "What our Galeries Lafayette file is, and is not" },
      { q: "Hypothetical brand Maison Lune: last month brought €120,000 from 1,000 order lines and 1,500 units. The manager says: “Our average piece now sells for €120.” What is the correct reading?",
        data: "Revenue €120,000 · Order lines 1,000 · Units 1,500",
        o: ["Correct: €120 is the average price of one piece", "Wrong: the average piece is €180, because there are more units", "Wrong: you cannot work out a price without the price_eur column", "€120 is the AOV; one piece brings €80 on average"], a: 3,
        why: "AOV = revenue ÷ order lines = €120,000 ÷ 1,000 = €120. Revenue per unit = revenue ÷ units = €120,000 ÷ 1,500 = €80. When customers take more than one piece, the two numbers differ, so always say which one you mean.", s: 13, t: "The nine numbers you will calculate today" },
      { q: "The committee asks: “We grew in 2025. Did we sell more, or sell more expensively?” Read the Galeries Lafayette year pivot.",
        data: "2025 vs 2024 · Revenue +6.9% · Units −0.3% · Order lines −0.4% · AOV +7.4%",
        o: ["Value growth: about the same purchases, more money in each one", "Volume growth: more pieces sold, each at a slightly lower price", "No real growth: units fell, so the +6.9% must be a data error", "Traffic growth: more order lines, each with a smaller basket"], a: 0,
        why: "Units and order lines are flat, but revenue and AOV are up about 7%. So the growth comes from more money per purchase, not from more purchases. The next question is why: higher prices, more leather goods in the mix, or fewer discounts.", s: 24, t: "Revenue up, units flat: we grew in value, not in volume" },
      { q: "Two hypothetical brands show their monthly revenue for 2025. Which one has the bumpier months?",
        data: "Brand A: average €200k per month, standard deviation €20k · Brand B: average €50k per month, standard deviation €15k",
        o: ["Brand A, because its standard deviation is bigger: €20k vs €15k", "Brand B, because its CV is 0.30, against 0.10 for Brand A", "Both the same, because both brands have twelve months of data", "You cannot say without the peak month and low month of each"], a: 1,
        why: "CV = STDEV ÷ AVERAGE. Brand A: 20 ÷ 200 = 0.10. Brand B: 15 ÷ 50 = 0.30. A bigger brand has a bigger standard deviation just because its numbers are bigger; the CV makes brands of different sizes comparable.", s: 25, t: "Month by month: growth, volatility, peak vs low" },
      { q: "Galeries Lafayette: 18 of 58 products make 70% of revenue, and the Signature tote alone makes 18%. A director proposes: “Drop the 20 smallest products to simplify the range.” What is the best reply?",
        o: ["Agree: products outside the top 70% add cost and almost no revenue", "Agree, and move the money saved into more Signature tote stock", "Disagree: never drop a product, because every line has loyal fans", "First check each small product's trend, returns and role, like entry items"], a: 3,
        why: "A Pareto chart shows concentration, not which products to cut. A small product can be growing, have few returns or bring people in, like a €58 lipstick before a €650 bag. And look at the other side too: one tote is almost a fifth of the business, which is a risk.", s: 37, t: "One tote is almost a fifth of the business" },
      { q: "Galeries Lafayette: discounted lines sell 25% more units per line than full-price lines. The sales director wants more discounts in 2026. Which numbers should make her think again?",
        data: "Discounted vs full price · Units per line +25% · Revenue per line −8% · Revenue per unit −26% · Return rate 11% vs 8%",
        o: ["None: +25% units is bigger than −8% revenue, so discounts win", "Only the return rate; the revenue numbers are normal for any sale", "Each line brings 8% less money, each piece 26% less, more come back", "Units per line, because 1.5 pieces per line is too many for a store"], a: 2,
        why: "Discounts buy units, not money: shoppers take more pieces, but each line brings less revenue and more pieces come back. Also, most discounted lines happen in the sale months, when different people shop, so this comparison does not prove what a discount causes.", s: 41, t: "Discounts buy units, not money" },
      { q: "Hypothetical brand Atelier Nord ran a “Winter Lights” store campaign in December. Campaign lines brought €400,000. The marketing team writes: “Winter Lights created €400k of sales.” What is the best check?",
        o: ["Compare with a baseline: the same weeks last year, or a channel without it", "Divide €400,000 by the number of campaign days to get the daily effect", "Count the campaign lines, because more lines prove a stronger effect", "Compare the campaign's AOV with the AOV of all the other campaigns"], a: 0,
        why: "December brings shoppers anyway, so campaign revenue is not campaign effect. Only the difference against a baseline (what would have happened without the campaign) shows extra sales. This is correlation and causation again, from Week 2.", s: 43, t: "Each campaign lives in its own channel" },
      { q: "Galeries Lafayette 2025 by channel. The app team says: “The app is now our most important channel.” What is the best reading?",
        data: "Store: 60% of revenue, +1.5% · Online: 27%, −0.6% · App: 13%, +81%",
        o: ["Agree: +81% growth means the app has overtaken the store", "The app grows fastest but is the smallest; the store brings 60%", "Disagree: growth of 81% is too high to be real and must be wrong", "Online matters most: it sits between the two in share and growth"], a: 1,
        why: "Growth and share answer different questions. +81% on a small base is fast growth, but the store still brings almost five times as much money. Report both together: “The app grew 81% and now brings 13% of revenue.”", s: 45, t: "The store leads, the app grows fastest" },
      { q: "Hypothetical brand Kira's till data shows its green trench sold only 4 pieces in March. The buyer wants to cancel the reorder. Then you learn the trench was out of stock in most stores that month. Which source do you check first?",
        o: ["Social media: likes and saves show whether people liked the trench", "Paid media: clicks on the trench ads show the real level of demand", "Stock and RFID data: till data cannot show demand you missed", "CRM and loyalty data: it shows which customers bought the trench"], a: 2,
        why: "Every source has a blind spot. Till data only shows what sold, not who wanted to buy and found an empty rail. Stock data shows what was there to sell, so you can see whether low sales mean low demand or no stock.", s: 8, t: "Where retail data comes from" },
      { q: "You want to show that revenue grew while units stayed flat over 24 months. A colleague makes one chart with revenue (€) on the left axis and units on a second axis on the right. What is the better choice?",
        o: ["Keep the two axes, but make the right axis start at zero", "A pie chart for each year, with revenue and units side by side", "One column chart with revenue and units as bars next to each other", "Index both lines to 100 = January 2024, on one axis"], a: 3,
        why: "With two y-axes, you can move each scale until the lines cross or separate as you like, so the chart can say anything. An index (each month ÷ the first month × 100) puts both on one honest scale. Two separate charts are also fine.", s: 27, t: "Revenue vs units on one axis: the index" },
      { q: "A merchandiser asks: “Which of our 58 products sell many pieces for little money, and which sell few pieces for a lot?” Which chart answers this most simply?",
        o: ["A scatter chart: units on the x-axis, revenue on the y-axis", "Two bar charts side by side, one for units and one for revenue", "A pie chart of revenue, with one slice for each of the 58 products", "A line chart of revenue, with the products in A to Z order"], a: 0,
        why: "Two numbers per item means a scatter chart: each dot is one product. Top left = few units, much revenue (expensive); bottom right = many units, little revenue (popular). 58 pairs of bars or a 58-slice pie cannot be read.", s: 48, t: "Which chart for which question?" },
      { q: "Hypothetical brand Velo's report shows a column chart: 2024 €1.00m, 2025 €1.05m. The y-axis starts at €0.98m, so the 2025 bar looks more than three times taller. What is the problem?",
        o: ["None: the numbers on the chart are right, so it is honest", "It should be a pie chart, because there are only two years", "Bars must start at zero; here +5% looks like +250%", "The axis should start at €1.05m to make the growth clearer"], a: 2,
        why: "People read a bar's length as its size, so bars must start at zero. Revenue grew 5%, but from €0.98m the bars are 0.02 and 0.07 high: the 2025 bar looks 3.5 times taller. Lines may zoom in; bars may not.", s: 49, t: "Where the axis starts changes the story" },
      { q: "A slide shows a pie chart with 7 slices in 7 bright colours: each category's share of 2025 revenue. The committee asks: “Which category is second?” Nobody can tell. What should you use instead?",
        o: ["A bar chart sorted from biggest to smallest, with the % on each bar", "A 3D pie chart, so the size difference between slices is clearer", "A line chart with the seven categories along the x-axis", "A table with the seven numbers in alphabetical order"], a: 0,
        why: "People compare lengths much better than angles. A sorted bar chart answers “which is second?” in one second. Use a pie only with 2 or 3 slices, and never in 3D.", s: 50, t: "Five checks for every chart" },
      { q: "Before the committee meeting you check four draft charts of 2025 revenue by channel. Which one passes all five chart checks?",
        o: ["Title “Revenue by channel”; sorted bars from zero; € and 2024–2025 shown; all bars grey", "Title “The app grew 81%”; bars start at €200k; € and 2024–2025 shown; app bar highlighted", "Title “The app grew 81%”; 3D bars from zero; € and 2024–2025 shown; a different colour per bar", "Title “The app grew 81% in 2025”; bars from zero; € and 2024–2025 shown; app bar highlighted"], a: 3,
        why: "The five checks: the title says the insight, bars start at zero, units and period are visible, one message per chart, and colour means something. The first has a label as its title, the second cuts the axis, and the third uses 3D and colours that mean nothing.", s: 50, t: "Five checks for every chart" },
      { q: "You made a line chart of Galeries Lafayette revenue by month, 2024 vs 2025. Which title is the strongest headline?",
        o: ["Monthly revenue in 2024 and 2025, by month and by year", "2025 beat 2024 in 10 of 12 months; only March fell (−20%)", "2025 was a very strong year, with some ups and downs", "Revenue went down in March 2025 compared with March 2024"], a: 1,
        why: "Recipe: what happened + how much + compared with what. The first is a label, the third has no number, and the fourth is true but tells only a small part of the story. If the committee reads only the headline, they should still know what you found.", s: 53, t: "Weak headline, strong headline" },
      { q: "Hypothetical brand Sora's insight slide says: “Online returns are 17%, four times the store's 4%.” Which line is the best NEXT STEP?",
        o: ["E-com team tests free in-store returns for online orders in 3 cities for 6 weeks and compares return rates", "Online returns are much higher than store returns, and this costs the brand a lot of money", "We should think about ways to reduce online returns at some point in the future", "Returns are a big problem for the whole fashion industry, not only for Sora"], a: 0,
        why: "A next step says what we do, who does it and how we check. The second line is a “so what” (why it matters), the third is too vague to act on, and the fourth moves away from the brand's own decision.", s: 52, t: "One slide, one insight" },
      { q: "Your headline: “Leather goods drove 2025 growth: +24%, now 37% of revenue.” Which line is the best SO WHAT for the Galeries Lafayette committee?",
        o: ["Leather goods revenue rose from about €605k to €753k in 2025", "Source: GL order lines 2024–2025 (simulated data, Sheets pivot)", "Our growth depends on one category, and in it on one tote (18%)", "Protect the tote's supply and price; test a second hero bag in the app"], a: 2,
        why: "The so what says why the finding matters for the brand: here, a dependence that is both a strength and a risk. The first line is evidence, the second is the source note and the fourth is the next step. Each part has its own place on the slide.", s: 52, t: "One slide, one insight" },
      { q: "Hypothetical brand Lumen's Black Friday campaign lines brought €200,000. The same weeks last year, with no campaign, brought €170,000. Which headline is honest and strong?",
        data: "Black Friday weeks · This year, with campaign: €200,000 · Last year, no campaign: €170,000",
        o: ["The Black Friday campaign created €200k of new sales this year", "Black Friday weeks: €200k, up €30k (+18%) on the same weeks last year", "Our Black Friday campaign was a big success with our customers", "Campaign analysis: Black Friday revenue and the other campaigns"], a: 1,
        why: "Campaign revenue is not campaign effect: the €200k includes sales that would have happened anyway. The baseline gives a number you can defend: €30k more than last year. Other things changed too, so write “up on last year”, not “caused by the campaign”.", s: 43, t: "Each campaign lives in its own channel" }
    ]
  },
  ethics: {
    title: "Week 2 · Helpful, creepy or manipulative?",
    poll: true,
    covers: "In-class game, no score. 12 fashion situations, real and made up. Sort each one on your phone, then we compare and discuss. There is a suggested answer, but you may disagree if you can defend it.",
    questions: [
      { q: "Your favourite brand's app says: “You kept size M from us four times. This jacket runs small, so we suggest L.”",
        o: ["Helpful", "Creepy", "Manipulative"], a: 0, why: "It uses your own purchase history, for your benefit, in a way you would expect. Fewer returns for you and for the brand.", t: "Size advice from purchase history" },
      { q: "Nordstrom, 2012–13: 17 stores tracked shoppers' phones through the store Wi-Fi to see where they walked. After complaints it stopped in May 2013.",
        o: ["Helpful", "Creepy", "Manipulative"], a: 1, why: "Real case. Shoppers did not expect their phones to be followed around the store. Legal or not, unexpected tracking feels like being watched.", t: "Nordstrom Wi-Fi tracking" },
      { q: "A product page shows “Only 2 left! 14 people are looking now”. Each time you reload the page, the timer starts again from 10:00.",
        o: ["Helpful", "Creepy", "Manipulative"], a: 2, why: "The pressure is fake. It pushes you to buy fast with false information: that is manipulation, also called a dark pattern.", t: "Fake countdown timer" },
      { q: "A style quiz asks your sizes, budget and the styles you love, then a stylist and an algorithm choose five pieces for you (the Stitch Fix model).",
        o: ["Helpful", "Creepy", "Manipulative"], a: 0, why: "You gave this data on purpose to get something back. This is zero-party data used exactly as promised.", t: "Style quiz (zero-party data)" },
      { q: "An email says: “Congratulations! We noticed you've been browsing maternity wear.” You have not told anyone yet. (Made up, but realistic.)",
        o: ["Helpful", "Creepy", "Manipulative"], a: 1, why: "Technically it is your browsing data, but the brand guessed something very private and said it out loud. Guessing sensitive life events crosses the line.", t: "Maternity email" },
      { q: "To close a pop-up, you must click: “No thanks, I don't like saving money.”",
        o: ["Helpful", "Creepy", "Manipulative"], a: 2, why: "This is called confirmshaming: it uses guilt to steer your choice. A fair pop-up has a plain “No thanks”.", t: "Confirmshaming pop-up" },
      { q: "A day after you visit a store, an ad says: “Still thinking about the boots you looked at in our Istiklal store yesterday?” (Made up, but realistic.)",
        o: ["Helpful", "Creepy", "Manipulative"], a: 1, why: "It shows the brand follows your location online and offline. Most people did not expect that, so it feels creepy, even if they clicked “accept” once.", t: "Location-based ad" },
      { q: "A virtual try-on app asks for your selfie. Page 14 of the terms says the brand keeps all photos to train its AI.",
        o: ["Helpful", "Creepy", "Manipulative"], a: 1, why: "Many would also say manipulative, because it is hidden. Using your face for something you did not expect, without clear consent, is the creepy part.", t: "Try-on selfies kept for training" },
      { q: "You visit the same dress page three times. Each time the price is a little higher. (Made up, but realistic.)",
        o: ["Helpful", "Creepy", "Manipulative"], a: 2, why: "Using your interest against you, so you pay more, is manipulation. It also destroys trust when people compare prices.", t: "Price rises with your visits" },
      { q: "You left a jacket in your basket. The next day you get one email: “Your jacket is still waiting, here is free delivery.” You signed up for emails.",
        o: ["Helpful", "Creepy", "Manipulative"], a: 0, why: "You agreed to emails and the message is useful. One reminder is service; five reminders in two days would start to feel different.", t: "Abandoned basket email" },
      { q: "A loyalty app asks to use your location only while you are inside the store, to show offers for that shop. You can switch it off at any time.",
        o: ["Helpful", "Creepy", "Manipulative"], a: 0, why: "Clear purpose, limited in time and place, and you stay in control. Being asked, and being able to say no, is what makes it fine.", t: "In-store location offers" },
      { q: "A brand sells its customer email list to a partner company you have never heard of. Soon you get emails from them. (Made up, but realistic.)",
        o: ["Helpful", "Creepy", "Manipulative"], a: 1, why: "Your data went somewhere you never expected. In the EU this usually needs your clear consent, so it can also be illegal, not only creepy.", t: "Email list sold to a partner" },
    ],
  },
  w2: {
    title: "Week 2 review quiz (homework)",
    covers: "Homework before Week 3. 25 scenario questions on everything from Week 2: problem framing first, datasets, the ladder, the three traps, how models learn and are tested, generative AI, data types, GDPR, bias and the AI Act. Some need a small calculation. Take your time.",
    questions: [
      { q: "Your director asks: “Should we move €20,000 of the denim launch budget from Instagram ads to TikTok ads?” Which metric answers this decision best?",
        o: ["Views per video on each platform, because TikTok videos reach more people", "Cost per purchase on each platform, tested on the same jeans for two weeks", "Followers gained on each platform during the launch month", "Average likes per post, since engagement shows which audience loves the brand"], a: 1,
        why: "Frame the problem first: the decision is about where €20,000 sells more jeans, so the metric must link spend to purchases. Views, followers and likes are easy to count and look good on a slide, but none of them tells you what the money buys.", s: 11, t: "Problem → question → metric → data" },
      { q: "A new handbag line sold 20% below plan. The creative director wants a new campaign. Look at the numbers: where is the real problem?",
        data: "Impressions: on plan · Product page views: on plan · Add-to-cart rate: on plan · Purchases: −20% · Black and tan, the two best colours, were out of stock from week 2",
        o: ["Awareness: not enough people saw the campaign", "Interest: people saw the bags but did not like them", "A barrier: shoppers wanted the bags, but the best colours were gone", "Keeping it: customers bought the bags and then sent most of them back"], a: 2,
        why: "Every step up to add-to-cart is on plan, so people saw the bags, looked closer and wanted them. They were stopped at the last step. Breaking “sales are bad” into questions shows the fix is stock, not a new campaign.", s: 9, t: "“Sales are bad” is not a question" },
      { q: "Store managers get a bonus for units sold. Units are up, but margins fall and the brand now looks “always on sale”. What is the best fix?",
        o: ["Pair units with full-price margin; ask how each target can be gamed", "Raise the units target so managers have to work harder for the bonus", "Drop all targets, because any number people are paid on will be gamed", "Reward Instagram followers per store instead, to rebuild the brand image"], a: 0,
        why: "Goodhart's law: when a number becomes a target, people deliver the number, not the goal. Managers hit units by discounting. Pair the metric with one that protects the real goal (profitable sales), and before you launch any target, ask how someone could hit it without solving the problem.", s: 12, t: "Chase the wrong number, get the wrong result" },
      { q: "The CMO asks: “Do we discount more online than in stores?” You have the order file below. What do you do?",
        data: "One row = one order · order_id (ID) · date (date) · channel (category) · category (category) · size (category) · price € (number) · discount (number) · returned (yes/no)",
        o: ["Add up the order_id column for each channel and compare the totals", "Count the returned orders in each channel and compare the two counts", "Average the price column online and in stores and compare the two", "Group the rows by channel and average the discount in each group"], a: 3,
        why: "Group by a category (channel), then average a number (discount). An ID is a label, not a number to add, and price or returns answer a different question. Reading what one row is and what type each column is tells you what you can calculate: exactly what you will do in the Week 3 spreadsheet lab.", s: 13, t: "Anatomy of a dataset: rows, columns, types" },
      { q: "Four sentences from the same trench-coat report. Which one is PRESCRIPTIVE, the top rung of the ladder?",
        o: ["Rain is forecast for next week, so demand for trench coats will rise", "Move 400 beige coats from online stock to the 30 stores and reorder", "Sales fell because the beige coat was out of stock in 30 stores", "Trench coat sales fell 12% last week compared with the plan"], a: 1,
        why: "Descriptive says what happened, diagnostic why, predictive what will happen. Prescriptive says what to do. It is the most valuable rung, and still a recommendation: a person decides whether to do it.", s: 19, t: "Climbing the ladder: Monday's handbags" },
      { q: "Online sales fell 15%. Your manager wants to cut app prices this afternoon. You break the number down first. What is the best next step?",
        data: "Website: +2% · App: −40% · The drop starts on the day of the new app update",
        o: ["Check the data and the app: did the update break tracking or checkout?", "Cut prices on the app to win back the customers who stopped buying there", "Conclude that app customers dislike the new collection and change the range", "Increase app advertising, because fewer people are opening the app now"], a: 0,
        why: "Slicing by channel and time points to one moment: the app update. Step zero is to check whether the data or the system is broken; many “crises” are data problems. A price cut would cost margin and fix nothing.", s: 20, t: "Why did it happen? Break the number down" },
      { q: "This season the M was re-cut 3 cm wider, but the label still says “M”. The report shows size M sales up 25% on last season, so the buyer wants to order far more M next year. What is the problem?",
        o: ["Correlation: M sales and the new cut rose together by pure chance", "Who is missing: the report leaves out customers who shop in stores", "Bad data: same label, but this season's M is not last season's M", "Nothing: a 25% rise is far too large to be a reporting problem"], a: 2,
        why: "Like NASA's pounds and newtons, or a 1958 size 8 versus a 2011 size 8: the label is the same, the measurement is not. Some customers who used to buy L may now fit M. Check what a label measures before you compare it, for example by looking at M and L together.", s: 24, t: "A size 8 is not a size 8" },
      { q: "E-commerce reports 1,200 sales of a dress, finance reports 950 and the store team 1,450. The board must decide whether to reorder. What goes on your slide?",
        o: ["The average of the three numbers, 1,200, to be fair to every team", "The biggest number, 1,450, because it includes every channel", "None of them until the teams agree: the data cannot be trusted yet", "The number that fits the decision, and a line on what it counts"], a: 3,
        why: "All three are right; they count different things (orders placed, orders paid and not returned, all channels together). Choose the definition that fits the decision and write under the chart what it counts and what it leaves out. A shared data dictionary stops this argument for good.", s: 25, t: "What exactly is a “sale”?" },
      { q: "“In weeks when influencers posted about our sneakers, sales were higher, so let's pay for more posts.” Which explanation is REVERSE CAUSATION?",
        o: ["Influencers choose to post about sneakers that are already selling well", "Busy seasons like Christmas raised both the number of posts and the sales", "The two lines moved together over a few weeks by pure chance", "Some orders were counted twice, so the sales figures are too high"], a: 0,
        why: "Reverse causation means the arrow points the other way: sales may cause posts. Before you say X caused Y, ask the three questions: could it be chance? could a third factor (like the season) cause both? could it be the other way round? Only a test tells you whether paying for posts adds sales.", s: 26, t: "Do Nicolas Cage films drown people?" },
      { q: "Customers who use the size guide return 30% less. The product team wants to show the guide as a pop-up to everyone. What is the strongest way to check that the guide itself causes fewer returns?",
        o: ["Ask guide users in a survey whether the guide helped them choose", "Compare this year's return rate with last year's, before the guide existed", "Show the guide to a random half of visitors and compare return rates", "Count how often the guide is opened on the pages with most returns"], a: 2,
        why: "Careful shoppers may use the guide AND return less anyway: a confounder, like loyal fans and the app. A random test (A/B test) makes the two groups alike, so any difference in returns comes from the guide.", s: 28, t: "App users spend twice as much. Push everyone to the app?" },
      { q: "92% of the reviews for a new trouser are 4 or 5 stars, yet its return rate is high. Which extra data best shows who is missing from the reviews?",
        o: ["More 5-star reviews, by offering a discount code for each review", "Return reasons from ALL orders, not only from people who wrote reviews", "Instagram comments and likes on the posts about the trousers", "The star ratings of competitors' trousers in the same price range and style"], a: 1,
        why: "Like Wald's bombers, you only see who came back: people who kept the item and felt strongly. Return reasons cover customers who were unhappy and left quietly. The people missing from your data are often the ones you most need to hear.", s: 31, t: "Your data only shows the people who made it in" },
      { q: "Calculate it. Yesterday's dashboard shows a record average order value. What is the average, and what should you do before you celebrate?",
        data: "100 orders yesterday: 99 orders of €80 each, and 1 order of €12,000",
        o: ["€80: the one big order does not count, so all is normal", "About €120: a strong day worth sharing with the team", "€12,080: the big order plus one normal order", "About €199: pulled up by one order, so check it first"], a: 3,
        why: "(99 × €80 + €12,000) ÷ 100 = (€7,920 + €12,000) ÷ 100 = €199.20. One unusual order (a test, a bulk order or an error) can move an average a lot: check the single orders before you report it.", s: 33, t: "Data detective: the traps behind the claims" },
      { q: "A model that picks bestsellers from product photos scored well on past data. Most past bestsellers were shot on a white background, and it now rates every white-background photo highly. What happened, and how would you check?",
        o: ["White backgrounds really do sell more, so reshoot the whole range on white", "The model is broken: delete it and go back to the buyers' instinct", "Like Clever Hans, it learned a shortcut: test it on new backgrounds", "It needs more colour in the photos, so add brighter product shots"], a: 2,
        why: "Hans did not count; he read the questioner's face. The model may not see what sells; it sees the background. A model that gives the right answers may still have learned the wrong lesson. Test it on cases it has never seen, such as the same product on different backgrounds.", s: 42, t: "Clever Hans, the horse that could count" },
      { q: "The return-risk model gives an order 72%. A colleague wants to cancel every order above 70%. What is the best response?",
        o: ["Show size advice before it ships, and let a person set the rule", "Agree: 72% means the order will almost certainly come back to us", "Block this customer from free returns on all of their future orders", "Ignore the score: models are wrong too often to base decisions on"], a: 0,
        why: "72% is a probability, not a fact: about 3 in 10 orders like this are kept. Cancelling them loses real sales and customers. Use the score to help (size advice, a fit question) and keep a person in charge of the rule.", s: 45, t: "A model: inputs in, a guess out" },
      { q: "Calculate it. How many returns did the model MISS, and how many FALSE ALARMS did it raise?",
        data: "200 test orders · 50 were really returned · The model flagged 60 orders · 40 of the flagged orders were really returned",
        o: ["Missed 20, false alarms 10", "Missed 10, false alarms 20", "Missed 40, false alarms 20", "Missed 10, false alarms 40"], a: 1,
        why: "It caught 40 of 50 returns, so it missed 10. It flagged 60 but only 40 were returns, so 20 were false alarms. Which mistake costs more (a kept order that gets an extra fit question, or a return you did not prevent) is a business decision, not a technical one.", s: 46, t: "Test it on cases it has never seen" },
      { q: "You give an AI ad tool one goal: “maximise clicks” for the new handbag ads. Clicks double, sales stay flat, and some ads now use misleading headlines. What went wrong, and what is the fix?",
        o: ["The tool is faulty: replace it with a different AI supplier at once", "Nothing yet: clicks turn into sales later, so give it more time", "The budget is too small: more spend will turn clicks into sales", "It chased the number you set: give it the real goal and check how"], a: 3,
        why: "Like the boat that circled the lagoon and the store targets in Part 1, a machine does what you reward, not what you mean. Inside AI this is called reward hacking. Say what a good result looks like (sales, without misleading people), check how the number is reached, and keep a person in charge.", s: 75, t: "A sales target, a boat, a swarm: the same lesson" },
      { q: "Your team has four AI ideas. Which one is SUPERVISED learning?",
        o: ["Group 50,000 customers into segments without saying what to look for", "Sort 20,000 product photos into groups of looks that seem alike", "Predict returns from past orders labelled “kept” or “returned”", "Write 500 new product descriptions from a short list of keywords"], a: 2,
        why: "Supervised learning learns from examples with the right answer (a label): past orders marked kept or returned. Grouping customers or photos without answers is unsupervised, and a person still names the groups. Writing descriptions is generative AI.", s: 47, t: "With answers, or without answers" },
      { q: "New planning software forecasts orders for every bag. It suggests 50,000 of a little-known model and only 10,000 of your bestseller. The order deadline is tomorrow. What should happen?",
        o: ["A planner who knows the market questions the big surprise first", "Place the order: the software has seen more data than any person", "Order the average of the forecast and last season's numbers", "Switch the software off for good and go back to spreadsheets"], a: 0,
        why: "Nike, 2001: forecasts went straight into orders, with too many Air Garnetts and too few Air Jordans, and $80–100 million in lost sales. A forecast is a guess with numbers. A big surprise is a reason to check, not a reason to order.", s: 50, t: "The software that ordered the wrong shoes" },
      { q: "You ask a chatbot for product copy for a linen shirt. It adds “certified organic, made in Portugal” and cites a 2024 sustainability report. None of this was in your brief. What is going on?",
        o: ["It looked the facts up in your company's product database", "It copied a competitor's product page, so the claims are probably true", "The claims must be right, because it named a specific source", "It writes what sounds likely, so claims and sources may be invented"], a: 3,
        why: "A language model is a very well-read autocomplete: it writes what sounds likely, not what is checked. Fluent is not true. Every claim, number and source must be checked by a person before it goes live; a false “organic” claim misleads customers, and your brand's name is on the page.", s: 54, t: "A very well-read autocomplete" },
      { q: "Match the data type: (1) loyalty card purchases, (2) a style quiz the customer fills in, (3) a list of “women 25–34 interested in luxury” bought from a broker.",
        o: ["1 zero-party, 2 first-party, 3 second-party", "1 first-party, 2 zero-party, 3 third-party", "1 first-party, 2 second-party, 3 third-party", "1 second-party, 2 zero-party, 3 first-party"], a: 1,
        why: "You collect purchases on your own channels (first-party); the customer tells you her preferences on purpose (zero-party); bought lists come from companies with no direct relationship (third-party). The closer to zero-party, the more trust and control you have.", s: 61, t: "Zero-, first-, second-, third-party data" },
      { q: "A newsletter form asks for birth date, phone number and home address in exchange for a 10% code, with a pre-ticked box “send me partner offers”. Which two GDPR habits does it break?",
        o: ["“Say why” and “let people control it”", "None: customers can simply untick the box", "“Collect less” and “have permission”", "“Let people control it” and “have permission”"], a: 2,
        why: "A 10% code does not need an address or phone number, and a pre-ticked box is not valid consent. Simple test: would you be comfortable explaining this form to the customer face to face?", s: 62, t: "Four habits for every fashion marketer" },
      { q: "To “give a more personal service”, a store team keeps notes on regular customers' illnesses and family problems. The CRM manager wants to add them to the customer database. What is the best reading?",
        o: ["A risk: sensitive data the brand should not collect or keep", "A valuable asset, as long as only store managers can see it", "Fine, because the notes were written to help the customers", "Fine as long as the notes stay on paper and never go into the CRM"], a: 0,
        why: "H&M was fined €35.3 million in 2020 for notes like these about employees' illnesses, family problems and beliefs. Good intentions do not make it lawful. Data you should not have is not an asset; it is a risk to people and to the brand.", s: 60, t: "A fashion brand's €35 million privacy fine" },
      { q: "A size recommender works well for sizes 36–40 but often fails for sizes 46 and above. The team wants to launch it in all markets next month. What is the most likely cause, and what should happen first?",
        o: ["Customers in larger sizes enter their measurements wrongly", "Larger sizes are returned more anyway, so the errors do not matter", "The model is still new and will correct itself after launch", "Few larger-size examples in training: test each size group first"], a: 3,
        why: "Like Amazon's hiring AI, a model copies its training data, including who is missing from it. Check how it performs for each group before launch, and add examples of the customers it fails.", s: 63, t: "The hiring AI that learned to prefer men" },
      { q: "Place three ideas from your CRM team: (1) an email “Your size 38 is back” to a customer who asked for a stock alert; (2) an ad saying “Walked past our Kadıköy store yesterday? Come in!” based on phone location; (3) a “Sale ends in 10:00” timer that restarts at every visit.",
        o: ["1 helpful, 2 manipulative, 3 creepy", "1 helpful, 2 creepy, 3 manipulative", "1 creepy, 2 helpful, 3 manipulative", "1 helpful, 2 helpful, 3 manipulative"], a: 1,
        why: "The stock alert uses data the customer gave you to save her time. The location ad uses data she did not expect you to use. The fake timer pushes a decision with false information, which breaks trust and can break consumer law.", s: 64, t: "Helpful, creepy, or manipulative?" },
      { q: "October 2026: a brand's EU website shows a realistic AI-generated video of a “model” walking in Paris, and an AI stylist chats with shoppers. Neither is labelled. What does the EU AI Act expect?",
        o: ["Label the video as AI-made, and the stylist must say it is an AI", "Nothing yet: these transparency rules only start in 2030", "Nothing: advertising and marketing content is exempt from the AI Act", "Only a note in the annual report saying the brand uses AI"], a: 0,
        why: "Since 2 August 2026 the AI Act's transparency rules apply: realistic AI-generated or manipulated images, video and audio must be disclosed, and a chatbot must tell people they are dealing with an AI unless it is obvious.", s: 69, t: "The EU AI Act: tell people when it is AI" }
    ]
  },
  q1: {
    title: "Week 1 · Quiz break 1",
    covers: "Week 1, Parts 1 to 6: intuition vs data, KPIs, the eight cases, the value chain and reading sales graphs.",
    questions: [
      {
        q: "Anna Wintour's first Vogue cover (1988) mixed couture with jeans. What did the data say before she ran it?",
        o: [
          "Nothing: it was a decision by instinct",
          "Sales of jeans were exploding",
          "An algorithm suggested it",
          "Focus groups loved it"
        ],
        a: 0,
        why: "There was no spreadsheet or focus group. Even the printers asked if it was a mistake. Intuition can win, but it has limits.",
        s: 9,
        t: "Anna Wintour's first cover"
      },
      {
        q: "How much textile waste does the world produce every year?",
        o: [
          "About 92 thousand tonnes",
          "About 9 tonnes per city",
          "Nobody measures it",
          "About 92 million tonnes"
        ],
        a: 3,
        why: "About 92 million tonnes a year, and roughly one truckload of textiles is landfilled or burned every second. Guessing demand wrong now has a planetary cost.",
        s: 12,
        t: "The cost of guessing wrong"
      },
      {
        q: "How often do Zara stores receive new stock?",
        o: [
          "Twice a year",
          "Once a season",
          "Twice a week",
          "Only when a store asks"
        ],
        a: 2,
        why: "Stores report what customers ask for, designers react, and nearby factories restock stores twice a week. The company is built as a feedback loop.",
        s: 14,
        t: "Zara: a company built as a feedback loop"
      },
      {
        q: "What does Shein do first when it spots a new trend online?",
        o: [
          "Waits for next season's runway",
          "Makes a small batch of about 100 to 200 pieces and watches the clicks",
          "Asks a magazine editor",
          "Produces 10,000 pieces for every store"
        ],
        a: 1,
        why: "Test small, then scale what sells. Customer behaviour decides the reorder within days.",
        s: 15,
        t: "Shein: test small, then scale"
      },
      {
        q: "At Stitch Fix, who picks the final five items in a customer's box?",
        o: [
          "A human stylist, from the algorithm's shortlist",
          "The warehouse team",
          "The algorithm alone",
          "The customer"
        ],
        a: 0,
        why: "The algorithm narrows thousands of items to a shortlist; the stylist adds nuance, builds outfits and adds a wildcard.",
        s: 16,
        t: "Stitch Fix: algorithms plus human stylists"
      },
      {
        q: "Which of these is a leading signal, one that appears before people buy?",
        o: [
          "Returns",
          "Markdowns",
          "Sell-through",
          "Google searches"

const PTS = 100;
const SITE_URL = "ilaydabegumizci.github.io/fashion-data-quiz"; // public address students open, shown on the projector
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get() { try { return JSON.parse(localStorage.getItem("fdq") || "null") } catch { return null } },
  set(v) { try { localStorage.setItem("fdq", JSON.stringify(v)) } catch {} },
};

let S = { view: "start", quiz: "w3", mode: null, i: 0, revealed: false, picked: null, teams: ["Team A", "Team B", "Team C", "Team D"], scores: [], awarded: [], solo: [], timer: 30 };
const saved = store.get();
if (saved && saved.view === "game" && (saved.mode === "team" || saved.mode === "present")) S = { ...S, ...saved };
let tick = null, left = 0;

function save() { store.set(S) }
function go(patch) { Object.assign(S, patch); save(); render() }

function header() {
  return `<header class="top"><div><div class="eyebrow">Fashion Data Science · Weeks 1–3</div><h1>Fashion Data <span>Quiz</span></h1></div>
  ${S.view !== "start" ? `<button class="ghost" id="home">Back to start</button>` : `<div class="muted">For the projector or for review at home</div>`}</header>`;
}

function startView() {
  const cards = Object.entries(QUIZZES).map(([k, z]) => `
    <section class="quizcard"><div class="eyebrow">${z.questions.length} ${z.poll ? "situations · no score" : "questions"}</div><h2>${esc(z.title)}</h2>
    <p class="covers muted" style="margin:0">${esc(z.covers)}</p>
    <div class="row"><button class="primary" data-start="${k}" data-mode="present">Present to the class</button><button data-start="${k}" data-mode="solo">Play on my phone</button></div>
    ${z.poll ? "" : `<button class="ghost small" data-start="${k}" data-mode="team">Or play as teams with a scoreboard</button>`}</section>`).join("");
  return `${header()}
  <div class="choices">${cards}</div>
  <div class="modes">
    <div class="mode"><h3>Present to the class</h3><p class="muted" style="margin:0">Put this page on the projector or share your screen. You show one question at a time and reveal the answer when everyone is ready.</p></div>
    <div class="mode"><h3>Play on my phone</h3><p class="muted" style="margin:0">Each student, in the room or online, answers on their own phone at the same time. Feedback is instant and private, and the end screen lists the slides to revisit.</p></div>
  </div>
  <details class="quizcard teamsetup"><summary><b>Settings</b> <span class="muted">timer, and team names for the team game</span></summary>
    <div class="names">${S.teams.map((n, i) => `<input id="team-${i}" value="${esc(n)}" aria-label="Team ${i + 1} name">`).join("")}</div>
    <div class="row"><button id="addteam" ${S.teams.length >= 8 ? "disabled" : ""}>Add a team</button><button id="delteam" ${S.teams.length <= 2 ? "disabled" : ""}>Remove last team</button>
    <label class="row muted" for="timer">Timer per question
      <select id="timer" style="font:inherit;padding:.4em;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg)">
        ${[0, 20, 30, 45].map((t) => `<option value="${t}" ${S.timer === t ? "selected" : ""}>${t ? t + " seconds" : "No timer"}</option>`).join("")}
      </select></label></div></details>
  <footer>Answers point to slide numbers in that week's deck.</footer>`;
}

function progressBar(z) {
  return `<div class="progress" aria-hidden="true">${z.questions.map((_, k) => `<i class="${k < S.i ? "done" : k === S.i ? "now" : ""}"></i>`).join("")}</div>`;
}

function board() {
  const order = S.teams.map((n, k) => ({ n, p: S.scores[k] || 0 })).sort((a, b) => b.p - a.p);
  return `<aside class="board" aria-live="polite"><h3>Scoreboard</h3><ol>${order.map((t, r) => `<li><span>${r + 1}</span><span>${esc(t.n)}</span><span class="pts">${t.p}</span></li>`).join("")}</ol>
  <div class="hint">${PTS} points per correct answer.</div></aside>`;
}

function gameView() {
  const z = QUIZZES[S.quiz], q = z.questions[S.i], team = S.mode === "team" || S.mode === "present", scoring = S.mode === "team";
  const answered = team ? S.revealed : S.picked !== null;
  const opts = q.o.map((t, k) => {
    let cls = "opt";
    if (answered) cls += z.poll ? (k === S.picked ? " mine" : k === q.a ? " correct" : " dim") : k === q.a ? " correct" : (!team && k === S.picked ? " wrong" : " dim");
    return team ? `<div class="${cls} opt-static"><b>${"ABCD"[k]}</b><span>${esc(t)}</span></div>`
      : `<button class="${cls}" data-opt="${k}" ${answered ? "disabled" : ""}><b>${"ABCD"[k]}</b><span>${esc(t)}</span></button>`;
  }).join("");
  let fb = "";
  if (answered) {
    const right = team || S.picked === q.a;
    fb = z.poll
      ? `<div class="feedback ok"><div class="verdict">${team ? "Suggested: " + q.o[q.a] : right ? "Same as the suggested answer: " + q.o[q.a] : "You chose " + q.o[S.picked] + ". Suggested: " + q.o[q.a] + ". Be ready to defend your choice."}</div>
      <div>${esc(q.why)}</div></div>`
      : `<div class="feedback ${right ? "ok" : "bad"}"><div class="verdict">${team ? "Answer: " + "ABCD"[q.a] : right ? "Correct" : "Not quite. The answer is " + "ABCD"[q.a]}</div>
      <div>${esc(q.why)}</div>
      <div class="slideref">${right && !team ? "Covered on" : "Go back to"} <span class="num">Slide ${q.s}</span> ${esc(q.t)}</div></div>`;
  }
  const award = scoring && S.revealed ? `<div class="award"><div class="muted">Tap the teams that got it right:</div><div class="chips">${S.teams.map((n, k) => `<button class="chip" data-award="${k}" aria-pressed="${(S.awarded[S.i] || []).includes(k)}">${esc(n)}</button>`).join("")}</div></div>` : "";
  const last = S.i === z.questions.length - 1;
  const ctrl = team
    ? (S.revealed ? `<button class="primary" id="next">${last ? (z.poll ? "Finish" : "See the final scores") : "Next question"}</button>` : `<button class="primary" id="reveal">${z.poll ? "Show the suggested answer" : "Reveal the answer"}</button>`)
    : (answered ? `<button class="primary" id="next">${last ? (z.poll ? "See my choices" : "See my result") : "Next question"}</button>` : `<span class="muted">Tap an answer.</span>`);
  return `${header()}<div class="game"><section class="stage">
    ${progressBar(z)}
    <div class="qmeta"><span class="eyebrow">${esc(z.title)} · Question ${S.i + 1} of ${z.questions.length}</span>${team && S.timer && !S.revealed ? `<span class="timer" id="clock">${S.timer}</span>` : ""}</div>
    <h2 class="question">${esc(q.q)}</h2>
    ${q.data ? `<div class="data">${esc(q.data)}</div>` : ""}
    <div class="options">${opts}</div>${fb}${award}
    ${S.mode === "present" && SITE_URL ? `<div class="join"><span>Answer on your phone:</span><code>${esc(SITE_URL)}</code><span class="muted">→ ${esc(z.title)} → Play on my phone</span></div>` : ""}
    <div class="row">${ctrl}</div></section>${scoring ? board() : ""}</div>`;
}

function resultView() {
  const z = QUIZZES[S.quiz];
  if (S.mode === "present" && z.poll) {
    return `${header()}<section class="stage"><div class="eyebrow">${esc(z.title)} · Finished</div><h2 class="question">Which one split the room?</h2>
      <p style="margin:0">Look at your choices on your phone. Where did you disagree with the suggested answer, and why?</p>
      <div class="row"><button class="primary" id="home2">Back to start</button></div></section>`;
  }
  if (S.mode === "solo" && z.poll) {
    const diff = z.questions.filter((q, k) => S.solo[k] !== q.a).length;
    return `${header()}<section class="stage"><div class="eyebrow">${esc(z.title)} · Your choices</div>
      <h2 class="question">You disagreed with the suggestion ${diff} time${diff === 1 ? "" : "s"}</h2>
      <p style="margin:0">There is no score. Bring the ones you disagreed with to the class discussion.</p>
      <ul class="review">${z.questions.map((q, k) => `<li><span class="slideref"><span class="num">${esc(q.o[S.solo[k]] ?? "–")}</span> ${esc(q.t)}${S.solo[k] !== q.a ? ` <span class="muted">(suggested: ${esc(q.o[q.a])})</span>` : ""}</span></li>`).join("")}</ul>
      <div class="row"><button class="primary" id="again">Play again</button><button id="home2">Back to start</button></div></section>`;
  }
  if (S.mode === "present") {
    return `${header()}<section class="stage"><div class="eyebrow">${esc(z.title)} · Finished</div><h2 class="question">Check your score on your phone</h2>
      <p style="margin:0">Your result screen lists the slides to revisit. Your score is only visible to you.</p>
      <div class="row"><button class="primary" id="home2">Back to start</button></div></section>`;
  }
  if (S.mode === "team") {
    const order = S.teams.map((n, k) => ({ n, p: S.scores[k] || 0 })).sort((a, b) => b.p - a.p);
    return `${header()}<section class="stage"><div class="eyebrow">${esc(z.title)} · Final scores</div><h2 class="question">${esc(order[0].n)} wins</h2>
      <div class="podium">${order.map((t, r) => `<div class="p"><span class="rank">${r + 1}</span><span>${esc(t.n)}</span><span>${t.p} pts</span></div>`).join("")}</div>
      <div class="row"><button class="primary" id="home2">Back to start</button></div></section>`;
  }
  const wrong = z.questions.map((q, k) => ({ q, ok: S.solo[k] === q.a })).filter((x) => !x.ok);
  const score = z.questions.length - wrong.length;
  return `${header()}<section class="stage"><div class="eyebrow">${esc(z.title)} · Your result</div>
    <h2 class="question">${score} of ${z.questions.length} correct</h2>
    ${wrong.length ? `<p style="margin:0">Go back to these slides before next week:</p><ul class="review">${wrong.map((x) => `<li><span class="slideref"><span class="num">Slide ${x.q.s}</span> ${esc(x.q.t)}</span></li>`).join("")}</ul>` : `<p style="margin:0">All correct. You are ready for the next part.</p>`}
    <div class="row"><button class="primary" id="again">Try again</button><button id="home2">Back to start</button></div></section>`;
}

function startClock() {
  clearInterval(tick);
  if (S.view !== "game" || S.mode === "solo" || !S.timer || S.revealed) return;
  left = S.timer;
  tick = setInterval(() => {
    left -= 1; const c = $("#clock");
    if (c) { c.textContent = Math.max(left, 0); c.classList.toggle("low", left <= 5) }
    if (left <= 0) { clearInterval(tick); go({ revealed: true }) }
  }, 1000);
}

function render() {
  const app = $("#app");
  app.innerHTML = S.view === "start" ? startView() : S.view === "game" ? gameView() : resultView();
  document.body.classList.toggle("solo", S.mode !== "team");
  if (S.view === "game" && !S.revealed && S.picked === null) startClock(); else clearInterval(tick);
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const z = QUIZZES[S.quiz];
  if (b.dataset.start) {
    S.teams = S.teams.map((n, i) => ($("#team-" + i)?.value || "").trim() || n);
    go({ view: "game", quiz: b.dataset.start, mode: b.dataset.mode, i: 0, revealed: false, picked: null, scores: S.teams.map(() => 0), awarded: [], solo: [] });
  } else if (b.id === "home" || b.id === "home2") go({ view: "start", mode: null });
  else if (b.id === "addteam") { S.teams = S.teams.map((n, i) => $("#team-" + i)?.value || n); go({ teams: [...S.teams, "Team " + "ABCDEFGH"[S.teams.length]] }) }
  else if (b.id === "delteam") { S.teams = S.teams.map((n, i) => $("#team-" + i)?.value || n); go({ teams: S.teams.slice(0, -1) }) }
  else if (b.id === "reveal") go({ revealed: true });
  else if (b.dataset.award !== undefined) {
    const k = +b.dataset.award, got = new Set(S.awarded[S.i] || []);
    got.has(k) ? got.delete(k) : got.add(k);
    const awarded = [...S.awarded]; awarded[S.i] = [...got];
    const scores = S.teams.map((_, t) => awarded.reduce((sum, a) => sum + ((a || []).includes(t) ? PTS : 0), 0));
    go({ awarded, scores });
  } else if (b.dataset.opt !== undefined && S.mode === "solo" && S.picked === null) {
    const solo = [...S.solo]; solo[S.i] = +b.dataset.opt; go({ picked: +b.dataset.opt, solo });
  } else if (b.id === "next") {
    if (S.i < z.questions.length - 1) go({ i: S.i + 1, revealed: false, picked: null });
    else go({ view: "result" });
  } else if (b.id === "again") go({ view: "game", i: 0, picked: null, solo: [] });
});
document.addEventListener("change", (e) => { if (e.target.id === "timer") go({ timer: +e.target.value }) });
document.addEventListener("input", (e) => { const m = e.target.id.match(/^team-(\d)$/); if (m) { S.teams[+m[1]] = e.target.value; save() } });
document.addEventListener("keydown", (e) => {
  if (S.view !== "game" || e.target.tagName === "INPUT") return;
  if (e.key === " " || e.key === "Enter") { const btn = $("#reveal") || $("#next"); if (btn && document.activeElement === document.body) { e.preventDefault(); btn.click() } }
});
render();
</script>
</body></html>
